<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BizBook — Business Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #f0f2f5;
  --sidebar: #0f172a;
  --sidebar-hover: #1e293b;
  --card: #fff;
  --primary: #059669;
  --primary-dk: #047857;
  --primary-lt: #d1fae5;
  --accent: #d97706;
  --accent-lt: #fef3c7;
  --danger: #dc2626;
  --danger-lt: #fee2e2;
  --info: #0284c7;
  --info-lt: #e0f2fe;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.1);
  --radius: 10px;
  --radius-lg: 16px;
  --font-ui: 'Plus Jakarta Sans', sans-serif;
  --font-hd: 'Space Grotesk', sans-serif;
  --sw: 260px;
  --th: 64px;
}
:root {
  --primary-color: #2563eb;
  --primary-dark: #1d4ed8;
  --success-color: #10b981;
  --text-dark: #1f2937;
  --text-light: #64748b;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --spacing-md: 1rem;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-xl: 22px;
  --shadow-sm: 0 4px 14px rgba(15,23,42,.08);
  --shadow-ml: 0 14px 38px rgba(15,23,42,.14);
  --transition: 220ms ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;min-height:100%}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes tIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes tOut{to{opacity:0;transform:translateX(30px);max-height:0;padding:0;margin:0}}
@keyframes shrink{from{width:100%}to{width:0%}}
@keyframes mIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.tl{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.tl::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-g{background:var(--primary-lt);color:var(--primary-dk)}
.tl-g::before{background:var(--primary)}
.tl-a{background:var(--accent-lt);color:#92400e}
.tl-a::before{background:var(--accent)}
.tl-r{background:var(--danger-lt);color:#991b1b}
.tl-r::before{background:var(--danger)}
.landing{position:fixed;inset:0;z-index:10001;background:var(--sidebar);overflow-y:auto;display:flex;flex-direction:column}
.landing.hidden{display:none}
.ld-hero{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem 2rem;position:relative;text-align:center}
.ld-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(5,150,105,.15),transparent 60%);pointer-events:none}
.ld-logo{width:120px;margin-bottom:16px;filter:drop-shadow(0 4px 20px rgba(0,0,0,.4));animation:floatY 3s ease-in-out infinite}
.ld-brand{font-family:var(--font-hd);font-size:3rem;font-weight:700;color:#fff;letter-spacing:-1px;margin-bottom:8px}
.ld-tag{color:rgba(255,255,255,.55);font-size:1.05rem;max-width:500px;margin-bottom:32px}
.ld-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ld-btn{padding:12px 32px;border-radius:10px;font-size:.95rem;font-weight:700;border:none;transition:all .25s;display:flex;align-items:center;gap:8px}
.ld-btn-p{background:var(--primary);color:#fff}
.ld-btn-p:hover{background:var(--primary-dk);box-shadow:0 6px 20px rgba(5,150,105,.4);transform:translateY(-2px)}
.ld-btn-o{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.2)}
.ld-btn-o:hover{border-color:var(--primary);color:var(--primary)}
.ld-features{padding:2rem;max-width:1200px;margin:0 auto;width:100%}
.ld-features h3{color:rgba(255,255,255,.9);font-family:var(--font-hd);font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:24px}
.ld-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ld-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:20px 16px;text-align:center;position:relative;overflow:hidden;transition:all .3s;cursor:pointer}
.ld-card:hover{background:rgba(255,255,255,.1);transform:translateY(-3px);border-color:rgba(5,150,105,.3)}
.ld-card i{font-size:1.8rem;color:var(--primary);margin-bottom:10px;display:block}
.ld-card h5{color:#fff;font-size:.9rem;font-weight:700;margin-bottom:4px}
.ld-card p{color:rgba(255,255,255,.4);font-size:.74rem;line-height:1.4}
.ld-lock{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:.65rem}
.ld-ft{text-align:center;padding:2rem;border-top:1px solid rgba(255,255,255,.06);margin-top:auto}
.ld-ft p{color:rgba(255,255,255,.25);font-size:.7rem}
.auth-screen{position:fixed;inset:0;z-index:10000;display:flex;background:var(--sidebar);transition:opacity .5s,visibility .5s}
.auth-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.auth-left{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:3rem;position:relative;overflow:hidden}
.auth-left::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(5,150,105,.2),transparent 60%);pointer-events:none}
.auth-logo{width:90px;margin-bottom:20px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.auth-brand{font-family:var(--font-hd);font-size:2.4rem;font-weight:700;color:#fff;letter-spacing:-1px}
.auth-tagline{color:rgba(255,255,255,.6);font-size:1rem;margin:8px 0 36px;text-align:center;max-width:320px}
.auth-feats{display:flex;flex-direction:column;gap:14px;width:100%;max-width:280px}
.auth-ft{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.75);font-size:.86rem}
.auth-ft i{width:32px;height:32px;border-radius:8px;background:rgba(5,150,105,.2);color:#34d399;display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0}
.auth-right{flex:1;background:var(--card);display:flex;align-items:center;justify-content:center;padding:2rem;overflow-y:auto}
.auth-wrap{width:100%;max-width:430px}
.auth-tabs{display:flex;margin-bottom:24px;border-bottom:2px solid var(--border)}
.auth-tab{flex:1;padding:10px;text-align:center;font-weight:700;font-size:.9rem;color:var(--muted);background:none;border:none;position:relative;cursor:pointer}
.auth-tab.active{color:var(--primary)}
.auth-tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--primary)}
.auth-form{display:none;animation:fadeUp .3s}
.auth-form.active{display:block}
.auth-err{background:var(--danger-lt);color:#991b1b;padding:10px 14px;border-radius:8px;font-size:.83rem;font-weight:500;margin-bottom:14px;display:none;align-items:center;gap:8px}
.auth-err.show{display:flex}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.81rem;font-weight:600;margin-bottom:4px}
.fg .req{color:var(--danger)}
.fi{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;transition:border-color .2s,box-shadow .2s;background:var(--card);color:var(--text)}
.fi:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.iw{position:relative}
.iw>.fa-solid{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.86rem;pointer-events:none}
.iw .fi{padding-left:38px}
.tog-pw{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:.88rem}
.btn-auth{width:100%;padding:12px;border:none;border-radius:8px;font-size:.93rem;font-weight:700;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-auth-p{background:var(--primary);color:#fff}
.btn-auth-p:hover{background:var(--primary-dk);box-shadow:0 4px 12px rgba(5,150,105,.3)}
.auth-ft-link{text-align:center;margin-top:18px;font-size:.83rem;color:var(--muted)}
.auth-ft-link a{color:var(--primary);font-weight:600;cursor:pointer}
.step-ind{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
.sdot{width:26px;height:26px;border-radius:50%;background:var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;transition:all .3s}
.sdot.on{background:var(--primary);color:#fff}
.sdot.done{background:var(--primary-lt);color:var(--primary)}
.sline{width:36px;height:2px;background:var(--border);transition:background .3s}
.sline.on{background:var(--primary)}
.pw-str{height:4px;border-radius:2px;background:var(--border);margin-top:5px;overflow:hidden}
.pw-bar{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0}
.divider-a{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:.8rem;font-weight:600}
.divider-a::before,.divider-a::after{content:'';flex:1;height:1px;background:var(--border)}
.role-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);overflow-y:auto;display:none}
.role-screen.show{display:block}
.rs-header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.rs-header h2{font-family:var(--font-hd);font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:8px}
.rs-header h2 i{color:var(--primary)}
.rs-body{max-width:1100px;margin:0 auto;padding:32px 24px}
.rs-biz{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:28px;display:flex;align-items:center;gap:16px}
.rs-biz .biz-ic{width:50px;height:50px;border-radius:12px;background:var(--primary-lt);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.rs-biz h3{font-size:1.1rem;font-weight:700}
.rs-biz p{font-size:.82rem;color:var(--muted)}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.rs-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;transition:all .3s;position:relative;overflow:hidden}
.rs-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.rs-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.rs-card.mgr::before{background:linear-gradient(90deg,#059669,#10b981)}
.rs-card.sk::before{background:linear-gradient(90deg,#0284c7,#38bdf8)}
.rs-card.cash::before{background:linear-gradient(90deg,#d97706,#fbbf24)}
.rs-card.sell::before{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.rs-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:14px}
.rs-card.mgr .rs-icon{background:var(--primary-lt);color:var(--primary)}
.rs-card.sk .rs-icon{background:var(--info-lt);color:var(--info)}
.rs-card.cash .rs-icon{background:var(--accent-lt);color:var(--accent)}
.rs-card.sell .rs-icon{background:#ede9fe;color:#7c3aed}
.rs-card h4{font-family:var(--font-hd);font-size:1.1rem;font-weight:700;margin-bottom:4px}
.rs-card .rs-desc{font-size:.82rem;color:var(--muted);margin-bottom:14px;line-height:1.5}
.rs-perms{list-style:none;margin-bottom:18px}
.rs-perms li{font-size:.78rem;color:var(--muted);padding:3px 0;display:flex;align-items:center;gap:6px}
.rs-perms li i{color:var(--primary);font-size:.65rem}
.rs-btn{width:100%;padding:10px;border:none;border-radius:8px;font-size:.86rem;font-weight:700;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.rs-card.mgr .rs-btn{background:var(--primary);color:#fff}
.rs-card.mgr .rs-btn:hover{background:var(--primary-dk)}
.rs-card.sk .rs-btn{background:var(--info);color:#fff}
.rs-card.sk .rs-btn:hover{background:#0369a1}
.rs-card.cash .rs-btn{background:var(--accent);color:#fff}
.rs-card.cash .rs-btn:hover{background:#b45309}
.rs-card.sell .rs-btn{background:#7c3aed;color:#fff}
.rs-card.sell .rs-btn:hover{background:#6d28d9}
.rs-status{font-size:.72rem;font-weight:600;margin-top:8px;text-align:center}
.rs-status.on{color:var(--primary)}
.rs-status.off{color:var(--muted)}
.rs-ft{text-align:center;padding:2rem;border-top:1px solid var(--border);margin-top:40px}
.rs-ft p{color:var(--muted);font-size:.7rem}
.overlay-auth{position:fixed;inset:0;z-index:9998;background:var(--sidebar);display:none;align-items:center;justify-content:center}
.overlay-auth.show{display:flex}
.auth-box{background:var(--card);border-radius:var(--radius-lg);padding:32px;width:100%;max-width:420px;margin:1rem;animation:mIn .25s ease}
.auth-box .ab-back{background:none;border:none;color:var(--muted);font-size:.84rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:6px;cursor:pointer}
.auth-box .ab-back:hover{color:var(--primary)}
.auth-box .role-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:6px}
.role-badge.rb-mgr{background:var(--primary-lt);color:var(--primary)}
.role-badge.rb-sk{background:var(--info-lt);color:var(--info)}
.role-badge.rb-cash{background:var(--accent-lt);color:#92400e}
.role-badge.rb-sell{background:#ede9fe;color:#7c3aed}
.auth-box h3{font-family:var(--font-hd);font-size:1.3rem;font-weight:700;margin-bottom:4px}
.auth-box .ab-sub{font-size:.82rem;color:var(--muted);margin-bottom:20px}
.stabs{display:flex;margin-bottom:20px;border-bottom:2px solid var(--border)}
.stab{flex:1;padding:8px;text-align:center;font-weight:700;font-size:.85rem;color:var(--muted);background:none;border:none;position:relative;cursor:pointer}
.stab.active{color:var(--primary)}
.stab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--primary)}
.sform{display:none;animation:fadeUp .3s}
.sform.active{display:block}
.mgr-ic{width:60px;height:60px;border-radius:16px;background:var(--primary-lt);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 16px}
.sidebar{position:fixed;top:0;left:0;width:var(--sw);height:100vh;background:var(--sidebar);z-index:900;display:none;flex-direction:column;transition:transform .3s}
.sidebar.vis{display:flex}
.sb-brand{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand span{font-family:var(--font-hd);font-size:1.15rem;font-weight:700;color:#fff}
.sb-nav{flex:1;overflow-y:auto;padding:8px 6px}
.sb-lbl{padding:7px 12px 4px;font-size:.66rem;font-weight:700;color:rgba(255,255,255,.22);text-transform:uppercase;letter-spacing:1.5px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:8px;color:#94a3b8;font-size:.84rem;font-weight:500;transition:all .2s;margin-bottom:1px;position:relative;cursor:pointer}
.ni:hover{background:var(--sidebar-hover);color:#e2e8f0}
.ni.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(5,150,105,.35)}
.ni i{width:17px;text-align:center;font-size:.88rem}
.ni .bdg{position:absolute;right:10px;background:var(--danger);color:#fff;font-size:.58rem;font-weight:700;padding:2px 6px;border-radius:10px}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.sb-bd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:899;display:none}
.sb-bd.show{display:block}
.topbar{position:fixed;top:0;left:var(--sw);right:0;height:var(--th);background:var(--card);border-bottom:1px solid var(--border);display:none;align-items:center;justify-content:space-between;padding:0 22px;z-index:800;box-shadow:var(--shadow)}
.topbar.vis{display:flex}
.tb-left{display:flex;align-items:center;gap:12px}
.menu-tog{display:none;background:none;border:none;font-size:1.2rem;color:var(--muted);padding:6px}
.biz-sel{position:relative}
.biz-sel select{appearance:none;background:var(--bg);border:1px solid var(--border);padding:7px 32px 7px 12px;border-radius:8px;font-size:.84rem;font-weight:600;color:var(--text);min-width:160px;cursor:pointer}
.biz-sel select:focus{outline:none;border-color:var(--primary)}
.biz-sel::after{content:'\f107';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.72rem;pointer-events:none}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.92rem;transition:all .2s;position:relative}
.tb-btn:hover{border-color:var(--primary);color:var(--primary)}
.tb-btn .cnt{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;font-size:.56rem;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.u-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:8px;background:var(--bg);border:1px solid var(--border);cursor:pointer;position:relative}
.u-av{width:28px;height:28px;border-radius:7px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;flex-shrink:0}
.u-chip-info{display:flex;flex-direction:column}
.uc-name{font-size:.8rem;font-weight:600;line-height:1.2}
.uc-role{font-size:.64rem;color:var(--muted)}
.u-dd{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);min-width:200px;overflow:hidden;display:none;z-index:100}
.u-dd.show{display:block}
.udd{display:flex;align-items:center;gap:9px;padding:9px 13px;font-size:.84rem;border:none;width:100%;text-align:left;font-family:inherit;color:var(--text);cursor:pointer;background:transparent}
.udd:hover{background:var(--bg)}
.udd.dng{color:var(--danger)}
.udd.dng i{color:var(--danger)}
.udd i{width:15px;text-align:center;color:var(--muted)}
.dd-div{height:1px;background:var(--border)}
.main{margin-left:var(--sw);margin-top:var(--th);padding:22px;min-height:calc(100vh - var(--th));display:none}
.main.vis{display:block}
.section{display:none;animation:fadeUp .3s}
.section.active{display:block}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.sh h2{font-family:var(--font-hd);font-size:1.45rem;font-weight:700}
.sh p{color:var(--muted);font-size:.86rem;margin-top:1px}
.sh-acts{display:flex;gap:7px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:.84rem;font-weight:600;border:none;transition:all .2s}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-dk);box-shadow:0 4px 12px rgba(5,150,105,.3)}
.btn-a{background:var(--accent);color:#fff}
.btn-a:hover{background:#b45309}
.btn-d{background:var(--danger);color:#fff}
.btn-d:hover{background:#b91c1c}
