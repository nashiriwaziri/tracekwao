<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
 <title>BizBook — Business Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#f0f2f5;--sidebar:#0f172a;--sidebar-hover:#1e293b;--card:#fff;--primary:#059669;--primary-dk:#047857;--primary-lt:#d1fae5;--accent:#d97706;--accent-lt:#fef3c7;--danger:#dc2626;--danger-lt:#fee2e2;--info:#0284c7;--info-lt:#e0f2fe;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 6px rgba(0,0,0,.07);--shadow-lg:0 10px 15px rgba(0,0,0,.1);--radius:10px;--radius-lg:16px;--font-ui:'Plus Jakarta Sans',sans-serif;--font-hd:'Space Grotesk',sans-serif;--sw:260px;--th:64px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
a{text-decoration:none;color:inherit}button{cursor:pointer;font-family:inherit}input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pdot{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes tIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes tOut{to{opacity:0;transform:translateX(30px);max-height:0;padding:0;margin:0}}
@keyframes shrink{from{width:100%}to{width:0%}}
@keyframes mIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.tl{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.tl::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-g{background:var(--primary-lt);color:var(--primary-dk)}.tl-g::before{background:var(--primary)}
.tl-a{background:var(--accent-lt);color:#92400e}.tl-a::before{background:var(--accent)}
.tl-r{background:var(--danger-lt);color:#991b1b}.tl-r::before{background:var(--danger)}

/* LANDING */
.landing{position:fixed;inset:0;z-index:10001;background:var(--sidebar);overflow-y:auto;display:flex;flex-direction:column}
.landing.hidden{display:none}
.ld-hero{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem 2rem;position:relative;text-align:center}
.ld-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(5,150,105,.15),transparent 60%);pointer-events:none}
.ld-logo{width:120px;margin-bottom:16px;filter:drop-shadow(0 4px 20px rgba(0,0,0,.4));animation:floatY 3s ease-in-out infinite}
.ld-brand{font-family:var(--font-hd);font-size:3rem;font-weight:700;color:#fff;letter-spacing:-1px;margin-bottom:8px}
.ld-tag{color:rgba(255,255,255,.55);font-size:1.05rem;max-width:500px;margin-bottom:32px}
.ld-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ld-btn{padding:12px 32px;border-radius:10px;font-size:.95rem;font-weight:700;border:none;transition:all .25s;display:flex;align-items:center;gap:8px}
.ld-btn-p{background:var(--primary);color:#fff}.ld-btn-p:hover{background:var(--primary-dk);box-shadow:0 6px 20px rgba(5,150,105,.4);transform:translateY(-2px)}
.ld-btn-o{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.2)}.ld-btn-o:hover{border-color:var(--primary);color:var(--primary)}
.ld-features{padding:2rem;max-width:1200px;margin:0 auto;width:100%}
.ld-features h3{color:rgba(255,255,255,.9);font-family:var(--font-hd);font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:24px}
.ld-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ld-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:20px 16px;text-align:center;position:relative;overflow:hidden;transition:all .3s;cursor:pointer}
.ld-card:hover{background:rgba(255,255,255,.1);transform:translateY(-3px);border-color:rgba(5,150,105,.3)}
.ld-card i{font-size:1.8rem;color:var(--primary);margin-bottom:10px;display:block}
.ld-card h5{color:#fff;font-size:.9rem;font-weight:700;margin-bottom:4px}
.ld-card p{color:rgba(255,255,255,.4);font-size:.74rem;line-height:1.4}
.ld-lock{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:.65rem}
.ld-ft{text-align:center;padding:2rem;border-top:1px solid rgba(255,255,255,.06);margin-top:auto}
.ld-ft img{height:36px;opacity:.4;margin-bottom:6px}
.ld-ft p{color:rgba(255,255,255,.25);font-size:.7rem}

/* AUTH */
.auth-screen{position:fixed;inset:0;z-index:10000;display:flex;background:var(--sidebar);transition:opacity .5s,visibility .5s}
.auth-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.auth-left{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:3rem;position:relative;overflow:hidden}
.auth-left::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(5,150,105,.2),transparent 60%);pointer-events:none}
.auth-logo{width:90px;margin-bottom:20px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.auth-brand{font-family:var(--font-hd);font-size:2.4rem;font-weight:700;color:#fff;letter-spacing:-1px}
.auth-tagline{color:rgba(255,255,255,.6);font-size:1rem;margin:8px 0 36px;text-align:center;max-width:320px}
.auth-feats{display:flex;flex-direction:column;gap:14px;width:100%;max-width:280px}
.auth-ft{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.75);font-size:.86rem}
.auth-ft i{width:32px;height:32px;border-radius:8px;background:rgba(5,150,105,.2);color:#34d399;display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0}
.auth-right{flex:1;background:var(--card);display:flex;align-items:center;justify-content:center;padding:2rem;overflow-y:auto}
.auth-wrap{width:100%;max-width:430px}
.auth-tabs{display:flex;margin-bottom:24px;border-bottom:2px solid var(--border)}
.auth-tab{flex:1;padding:10px;text-align:center;font-weight:700;font-size:.9rem;color:var(--muted);background:none;border:none;position:relative;cursor:pointer}
.auth-tab.active{color:var(--primary)}.auth-tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--primary)}
.auth-form{display:none;animation:fadeUp .3s}.auth-form.active{display:block}
.auth-err{background:var(--danger-lt);color:#991b1b;padding:10px 14px;border-radius:8px;font-size:.83rem;font-weight:500;margin-bottom:14px;display:none;align-items:center;gap:8px}
.auth-err.show{display:flex}
.fg{margin-bottom:14px}.fg label{display:block;font-size:.81rem;font-weight:600;margin-bottom:4px}.fg .req{color:var(--danger)}
.fi{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;transition:border-color .2s,box-shadow .2s;background:var(--card);color:var(--text)}
.fi:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.iw{position:relative}.iw>.fa-solid{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.86rem;pointer-events:none}.iw .fi{padding-left:38px}
.tog-pw{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:.88rem}
.btn-auth{width:100%;padding:12px;border:none;border-radius:8px;font-size:.93rem;font-weight:700;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-auth-p{background:var(--primary);color:#fff}.btn-auth-p:hover{background:var(--primary-dk);box-shadow:0 4px 12px rgba(5,150,105,.3)}
.auth-ft-link{text-align:center;margin-top:18px;font-size:.83rem;color:var(--muted)}.auth-ft-link a{color:var(--primary);font-weight:600;cursor:pointer}
.step-ind{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
.sdot{width:26px;height:26px;border-radius:50%;background:var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;transition:all .3s}
.sdot.on{background:var(--primary);color:#fff}.sdot.done{background:var(--primary-lt);color:var(--primary)}
.sline{width:36px;height:2px;background:var(--border);transition:background .3s}.sline.on{background:var(--primary)}
.pw-str{height:4px;border-radius:2px;background:var(--border);margin-top:5px;overflow:hidden}.pw-bar{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0}
.divider-a{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:.8rem;font-weight:600}.divider-a::before,.divider-a::after{content:'';flex:1;height:1px;background:var(--border)}

/* ROLE SELECT */
.role-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);overflow-y:auto;display:none}.role-screen.show{display:block}
.rs-header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.rs-header h2{font-family:var(--font-hd);font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:8px}.rs-header h2 i{color:var(--primary)}
.rs-body{max-width:1100px;margin:0 auto;padding:32px 24px}
.rs-biz{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:28px;display:flex;align-items:center;gap:16px}
.rs-biz .biz-ic{width:50px;height:50px;border-radius:12px;background:var(--primary-lt);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.rs-biz h3{font-size:1.1rem;font-weight:700}.rs-biz p{font-size:.82rem;color:var(--muted)}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.rs-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;transition:all .3s;position:relative;overflow:hidden}
.rs-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.rs-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.rs-card.mgr::before{background:linear-gradient(90deg,#059669,#10b981)}.rs-card.sk::before{background:linear-gradient(90deg,#0284c7,#38bdf8)}.rs-card.cash::before{background:linear-gradient(90deg,#d97706,#fbbf24)}.rs-card.sell::before{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.rs-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:14px}
.rs-card.mgr .rs-icon{background:var(--primary-lt);color:var(--primary)}.rs-card.sk .rs-icon{background:var(--info-lt);color:var(--info)}.rs-card.cash .rs-icon{background:var(--accent-lt);color:var(--accent)}.rs-card.sell .rs-icon{background:#ede9fe;color:#7c3aed}
.rs-card h4{font-family:var(--font-hd);font-size:1.1rem;font-weight:700;margin-bottom:4px}
.rs-card .rs-desc{font-size:.82rem;color:var(--muted);margin-bottom:14px;line-height:1.5}
.rs-perms{list-style:none;margin-bottom:18px}.rs-perms li{font-size:.78rem;color:var(--muted);padding:3px 0;display:flex;align-items:center;gap:6px}.rs-perms li i{color:var(--primary);font-size:.65rem}
.rs-btn{width:100%;padding:10px;border:none;border-radius:8px;font-size:.86rem;font-weight:700;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.rs-card.mgr .rs-btn{background:var(--primary);color:#fff}.rs-card.mgr .rs-btn:hover{background:var(--primary-dk)}
.rs-card.sk .rs-btn{background:var(--info);color:#fff}.rs-card.sk .rs-btn:hover{background:#0369a1}
.rs-card.cash .rs-btn{background:var(--accent);color:#fff}.rs-card.cash .rs-btn:hover{background:#b45309}
.rs-card.sell .rs-btn{background:#7c3aed;color:#fff}.rs-card.sell .rs-btn:hover{background:#6d28d9}
.rs-status{font-size:.72rem;font-weight:600;margin-top:8px;text-align:center}.rs-status.on{color:var(--primary)}.rs-status.off{color:var(--muted)}
.rs-ft{text-align:center;padding:2rem;border-top:1px solid var(--border);margin-top:40px}.rs-ft img{height:36px;opacity:.4;margin-bottom:6px}.rs-ft p{color:var(--muted);font-size:.7rem}

/* STAFF/MGR AUTH */
.overlay-auth{position:fixed;inset:0;z-index:9998;background:var(--sidebar);display:none;align-items:center;justify-content:center}.overlay-auth.show{display:flex}
.auth-box{background:var(--card);border-radius:var(--radius-lg);padding:32px;width:100%;max-width:420px;margin:1rem;animation:mIn .25s ease}
.auth-box .ab-back{background:none;border:none;color:var(--muted);font-size:.84rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:6px;cursor:pointer}.auth-box .ab-back:hover{color:var(--primary)}
.auth-box .role-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:6px}
.role-badge.rb-sk{background:var(--info-lt);color:var(--info)}.role-badge.rb-cash{background:var(--accent-lt);color:#92400e}.role-badge.rb-sell{background:#ede9fe;color:#7c3aed}
.auth-box h3{font-family:var(--font-hd);font-size:1.3rem;font-weight:700;margin-bottom:4px}.auth-box .ab-sub{font-size:.82rem;color:var(--muted);margin-bottom:20px}
.stabs{display:flex;margin-bottom:20px;border-bottom:2px solid var(--border)}
.stab{flex:1;padding:8px;text-align:center;font-weight:700;font-size:.85rem;color:var(--muted);background:none;border:none;position:relative;cursor:pointer}.stab.active{color:var(--primary)}.stab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--primary)}
.sform{display:none;animation:fadeUp .3s}.sform.active{display:block}
.mgr-ic{width:60px;height:60px;border-radius:16px;background:var(--primary-lt);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 16px}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sw);height:100vh;background:var(--sidebar);z-index:900;display:none;flex-direction:column;transition:transform .3s}
.sidebar.vis{display:flex}
.sb-brand{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand img{height:42px;width:auto;border-radius:6px}.sb-brand span{font-family:var(--font-hd);font-size:1.15rem;font-weight:700;color:#fff}
.sb-nav{flex:1;overflow-y:auto;padding:8px 6px}
.sb-lbl{padding:7px 12px 4px;font-size:.66rem;font-weight:700;color:rgba(255,255,255,.22);text-transform:uppercase;letter-spacing:1.5px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:8px;color:#94a3b8;font-size:.84rem;font-weight:500;transition:all .2s;margin-bottom:1px;position:relative;cursor:pointer}
.ni:hover{background:var(--sidebar-hover);color:#e2e8f0}.ni.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(5,150,105,.35)}
.ni i{width:17px;text-align:center;font-size:.88rem}
.ni .bdg{position:absolute;right:10px;background:var(--danger);color:#fff;font-size:.58rem;font-weight:700;padding:2px 6px;border-radius:10px}
.ni.rh{display:none!important}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.fb-st{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;font-size:.74rem;font-weight:600;background:rgba(239,68,68,.15);color:#f87171}
.fb-st .s-dot{width:7px;height:7px;border-radius:50%;background:#f87171;flex-shrink:0}

/* TOPBAR */
.topbar{position:fixed;top:0;left:var(--sw);right:0;height:var(--th);background:var(--card);border-bottom:1px solid var(--border);display:none;align-items:center;justify-content:space-between;padding:0 22px;z-index:800;box-shadow:var(--shadow)}
.topbar.vis{display:flex}
.tb-left{display:flex;align-items:center;gap:12px}
.menu-tog{display:none;background:none;border:none;font-size:1.2rem;color:var(--muted);padding:6px}
.biz-sel{position:relative}.biz-sel select{appearance:none;background:var(--bg);border:1px solid var(--border);padding:7px 32px 7px 12px;border-radius:8px;font-size:.84rem;font-weight:600;color:var(--text);min-width:160px;cursor:pointer}.biz-sel select:focus{outline:none;border-color:var(--primary)}
.biz-sel::after{content:'\f107';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.72rem;pointer-events:none}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.92rem;transition:all .2s;position:relative}.tb-btn:hover{border-color:var(--primary);color:var(--primary)}
.tb-btn .cnt{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;font-size:.56rem;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.u-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:8px;background:var(--bg);border:1px solid var(--border);cursor:pointer;position:relative}
.u-av{width:28px;height:28px;border-radius:7px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;flex-shrink:0}
.u-chip-info{display:flex;flex-direction:column}.uc-name{font-size:.8rem;font-weight:600;line-height:1.2}.uc-role{font-size:.64rem;color:var(--muted)}
.u-dd{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);min-width:200px;overflow:hidden;display:none;z-index:100}.u-dd.show{display:block}
.udd{display:flex;align-items:center;gap:9px;padding:9px 13px;font-size:.84rem;border:none;width:100%;text-align:left;font-family:inherit;color:var(--text);cursor:pointer;background:transparent}.udd:hover{background:var(--bg)}
.udd.dng{color:var(--danger)}.udd.dng i{color:var(--danger)}.udd i{width:15px;text-align:center;color:var(--muted)}
.dd-div{height:1px;background:var(--border)}

/* MAIN */
.main{margin-left:var(--sw);margin-top:var(--th);padding:22px;min-height:calc(100vh - var(--th));display:none}.main.vis{display:block}
.section{display:none;animation:fadeUp .3s}.section.active{display:block}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.sh h2{font-family:var(--font-hd);font-size:1.45rem;font-weight:700}.sh p{color:var(--muted);font-size:.86rem;margin-top:1px}
.sh-acts{display:flex;gap:7px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:.84rem;font-weight:600;border:none;transition:all .2s}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-dk);box-shadow:0 4px 12px rgba(5,150,105,.3)}
.btn-a{background:var(--accent);color:#fff}.btn-a:hover{background:#b45309}
.btn-d{background:var(--danger);color:#fff}.btn-d:hover{background:#b91c1c}
.btn-o{background:transparent;border:1.5px solid var(--border);color:var(--text)}.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-i{background:var(--info);color:#fff}.btn-i:hover{background:#0369a1}
.btn-sm{padding:5px 12px;font-size:.76rem;border-radius:6px}
.btn-icon{width:30px;height:30px;padding:0;justify-content:center;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.82rem;display:inline-flex;align-items:center}
.btn-icon:hover{border-color:var(--primary);color:var(--primary)}.btn-icon.dng:hover{border-color:var(--danger);color:var(--danger)}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;position:relative;overflow:hidden;transition:all .3s}
.mc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mc::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.mc.g::after{background:var(--primary)}.mc.a::after{background:var(--accent)}.mc.r::after{background:var(--danger)}.mc.b::after{background:var(--info)}.mc.pu::after{background:#7c3aed}
.mc-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.95rem;margin-bottom:10px}
.mc.g .mc-icon{background:var(--primary-lt);color:var(--primary)}.mc.a .mc-icon{background:var(--accent-lt);color:var(--accent)}.mc.r .mc-icon{background:var(--danger-lt);color:var(--danger)}.mc.b .mc-icon{background:var(--info-lt);color:var(--info)}.mc.pu .mc-icon{background:#ede9fe;color:#7c3aed}
.mc h3{font-family:var(--font-hd);font-size:1.6rem;font-weight:700;line-height:1;margin-bottom:2px}
.mc p{font-size:.74rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px}

.sb-bar{position:relative;margin-bottom:16px}.sb-bar input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--border);border-radius:8px;font-size:.86rem;background:var(--card)}.sb-bar input:focus{outline:none;border-color:var(--primary)}.sb-bar>i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.86rem}
.tw{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}.ts{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:550px}thead{background:var(--bg)}
th{padding:10px 13px;text-align:left;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:12px 13px;font-size:.84rem;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .15s}tbody tr:hover{background:#f8fafc}tbody tr:last-child td{border-bottom:none}
.empty-s{text-align:center;padding:40px 20px;color:var(--muted)}.empty-s i{font-size:2.2rem;margin-bottom:12px;opacity:.3}
.ch-g{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.ch-c{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.ch-c h4{font-family:var(--font-hd);font-size:.88rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}.ch-c h4 i{color:var(--primary)}
.ch-box{position:relative;height:230px}
.pf{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap}
.pf-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:.8rem;font-weight:600;color:var(--muted);transition:all .2s}.pf-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}


/* ROLE DASHBOARD */
.role-dash{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:22px;box-shadow:var(--shadow)}
.role-dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.role-dash-title{display:flex;align-items:center;gap:10px}.role-dash-title .rd-icon{width:40px;height:40px;border-radius:11px;background:var(--primary-lt);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.05rem}.role-dash-title h3{font-family:var(--font-hd);font-size:1.05rem}.role-dash-title p{font-size:.76rem;color:var(--muted)}
.role-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}.role-action{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:12px;text-align:left;transition:.2s}.role-action:hover{border-color:var(--primary);background:var(--primary-lt);transform:translateY(-2px)}.role-action i{color:var(--primary);font-size:1rem;margin-bottom:7px;display:block}.role-action strong{display:block;font-size:.8rem}.role-action span{display:block;color:var(--muted);font-size:.68rem;margin-top:2px}
.role-insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.ri{padding:11px 12px;border-radius:9px;background:var(--bg);border-left:3px solid var(--primary)}.ri.warn{border-left-color:var(--accent)}.ri.danger{border-left-color:var(--danger)}.ri.info{border-left-color:var(--info)}.ri b{display:block;font-size:1.1rem;font-family:var(--font-hd)}.ri small{font-size:.68rem;color:var(--muted)}
@media(max-width:700px){.role-dash{padding:14px}.role-actions{grid-template-columns:repeat(2,1fr)}.role-action{padding:10px}.role-insights{grid-template-columns:repeat(2,1fr)}}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:18px}.mo.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius-lg);width:100%;max-width:500px;max-height:88vh;overflow-y:auto;animation:mIn .25s ease}.modal.lg{max-width:650px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}.mh h3{font-family:var(--font-hd);font-size:1.05rem;font-weight:700}
.mcl{width:30px;height:30px;border-radius:7px;border:none;background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:all .2s}.mcl:hover{background:var(--danger-lt);color:var(--danger)}
.mb{padding:20px}.mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fgf{display:flex;flex-direction:column;gap:4px}.fgf.full{grid-column:1/-1}
.fgf label{font-size:.78rem;font-weight:600}.fgf label .req{color:var(--danger)}
.fgf input,.fgf select,.fgf textarea{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:.86rem;background:var(--card);color:var(--text);transition:border-color .2s}
.fgf input:focus,.fgf select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.conf-b{text-align:center;padding:14px 0}.conf-b i{font-size:2.5rem;color:var(--danger);margin-bottom:12px}.conf-b h4{font-size:1rem;font-weight:700;margin-bottom:5px}.conf-b p{color:var(--muted);font-size:.86rem}

/* TOAST */
.tc{position:fixed;top:74px;right:18px;z-index:99999;display:flex;flex-direction:column;gap:7px;pointer-events:none;max-width:340px;width:100%}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:11px 14px;display:flex;align-items:flex-start;gap:9px;box-shadow:var(--shadow-lg);animation:tIn .3s ease;position:relative;overflow:hidden}
.toast.rem{animation:tOut .3s ease forwards}
.ti{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0}
.toast.s .ti{background:var(--primary-lt);color:var(--primary)}.toast.e .ti{background:var(--danger-lt);color:var(--danger)}.toast.w .ti{background:var(--accent-lt);color:var(--accent)}.toast.i .ti{background:var(--info-lt);color:var(--info)}
.tb-body{flex:1;min-width:0}.tb-title{font-weight:700;font-size:.83rem}.tb-close{background:none;border:none;color:var(--muted);font-size:.9rem;padding:2px}
.t-bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 0 9px 9px;animation:shrink linear forwards}
.toast.s .t-bar{background:var(--primary)}.toast.e .t-bar{background:var(--danger)}.toast.w .t-bar{background:var(--accent)}.toast.i .t-bar{background:var(--info)}

/* NOTIF PANEL */
.np{position:fixed;top:var(--th);right:0;width:340px;height:calc(100vh - var(--th));background:var(--card);border-left:1px solid var(--border);z-index:850;transform:translateX(100%);transition:transform .3s;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.08)}.np.open{transform:translateX(0)}
.np-h{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}.np-h h3{font-family:var(--font-hd);font-size:1rem;font-weight:700}
.ni-n{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:9px;cursor:pointer;transition:background .15s;font-size:.84rem}.ni-n:hover{background:var(--bg)}

/* PROFILE */
.prof-grid{display:grid;grid-template-columns:280px 1fr;gap:20px}
.prof-left{display:flex;flex-direction:column;gap:16px}
.logo-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;text-align:center}
.logo-prev{width:100px;height:100px;border-radius:14px;border:2px dashed var(--border);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.logo-prev:hover{border-color:var(--primary)}.logo-prev img{width:100%;height:100%;object-fit:contain}.logo-prev i{font-size:2rem;color:var(--border)}.logo-prev input{position:absolute;inset:0;opacity:0;cursor:pointer}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
.info-card h4{font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.pi-r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:.85rem}.pi-r:last-child{border-bottom:none}.pi-l{color:var(--muted)}.pi-v{font-weight:600}
.prof-right{display:flex;flex-direction:column;gap:16px}
.prof-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.prof-form h4{font-family:var(--font-hd);font-size:1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:7px}.prof-form h4 i{color:var(--primary)}

/* POS */
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:18px;min-height:calc(100vh - var(--th) - 120px)}
.pos-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start;max-height:calc(100vh - var(--th) - 180px);overflow-y:auto;padding-right:6px}
.pos-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;cursor:pointer;transition:all .2s}
.pos-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.pos-card .pc-name{font-size:.78rem;font-weight:600;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-card .pc-price{font-size:1.2rem;font-weight:800;font-family:var(--font-hd);color:var(--accent)}
.pos-card .pc-stock{font-size:.7rem;color:var(--muted);margin-top:4px}
.pos-cart{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;max-height:calc(100vh - var(--th) - 120px)}
.pos-cart-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.pos-cart-head h4{font-family:var(--font-hd);font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:6px}
.pos-cart-body{flex:1;overflow-y:auto;padding:8px}
.pos-cart-item{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border);font-size:.82rem}
.pos-cart-item .ci-name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-cart-item .ci-qty{display:flex;align-items:center;gap:4px}
.pos-cart-item .ci-qty button{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.8rem;cursor:pointer}
.pos-cart-item .ci-qty span{min-width:18px;text-align:center;font-weight:700}
.pos-cart-foot{padding:14px 16px;border-top:1px solid var(--border)}
.pos-total{display:flex;justify-content:space-between;font-family:var(--font-hd);font-size:1.3rem;font-weight:800;margin-bottom:12px}

/* USERS */
.us-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:12px;transition:box-shadow .2s}.us-card:hover{box-shadow:var(--shadow-md)}
.us-av{width:46px;height:46px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;flex-shrink:0}
.us-av.av-sk{background:linear-gradient(135deg,#0284c7,#38bdf8)}.us-av.av-cash{background:linear-gradient(135deg,#d97706,#fbbf24)}.us-av.av-sell{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.us-info{flex:1}.us-info h4{font-size:.95rem;font-weight:700;margin-bottom:1px}.us-info p{font-size:.78rem;color:var(--muted)}
.us-acts{display:flex;gap:5px}
.role-b{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:5px;font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.role-b.manager{background:var(--primary-lt);color:var(--primary-dk)}.role-b.storekeeper{background:var(--info-lt);color:var(--info)}.role-b.cashier{background:var(--accent-lt);color:#92400e}.role-b.seller{background:#ede9fe;color:#7c3aed}

/* SYSTEM FOOTER */
.sys-ft{text-align:center;padding:28px 20px 18px;margin-top:40px;border-top:1px solid var(--border)}.sys-ft img{height:38px;opacity:.5;margin:0 auto 8px;display:block;transition:opacity .3s}.sys-ft img:hover{opacity:.8}.sys-ft p{font-size:.7rem;color:var(--muted)}

/* RCPT */
.rcpt{background:#fff;padding:20px;max-width:320px;margin:0 auto;font-family:'Courier New',monospace}.rcpt .rc-center{text-align:center}.rcpt .rc-line{border-top:1px dashed #ccc;margin:8px 0}.rcpt table{width:100%;border-collapse:collapse;font-size:.82rem}.rcpt th,.rcpt td{padding:4px 2px;text-align:left}.rcpt th{border-bottom:1px solid #ccc}

/* RESPONSIVE */
@media(max-width:1024px){.ch-g{grid-template-columns:1fr}.pos-layout{grid-template-columns:1fr}.pos-cart{max-height:400px}}
@media(max-width:900px){.auth-left{display:none}.auth-right{flex:1}.prof-grid{grid-template-columns:1fr}.rs-grid{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.topbar{left:0}.main{margin-left:0}.menu-tog{display:flex}.fgrid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.np{width:100%}.u-chip-info{display:none}.pos-products{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.rs-grid{grid-template-columns:1fr}.ld-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.metrics{grid-template-columns:1fr}.main{padding:12px}.sh h2{font-size:1.2rem}.ld-grid{grid-template-columns:1fr}}
.sb-bd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:899;display:none}.sb-bd.show{display:block}
.text-g{color:var(--primary)}.text-a{color:var(--accent)}.text-r{color:var(--danger)}.text-m{color:var(--muted)}
.fw7{font-weight:700}.mt4{margin-top:14px}
@media print{body *{visibility:hidden}.rcpt,.rcpt *{visibility:visible}.rcpt{position:fixed;top:0;left:50%;transform:translateX(-50%);width:320px}}


/* ============================================================
   BIZBOOK INTERNATIONAL DESIGN SYSTEM
   Clean, responsive, accessible and component-based
============================================================ */

/* 1. DESIGN TOKENS */
:root{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji';
  --primary-color:#2563eb;
  --primary-dark:#1d4ed8;
  --success-color:#10b981;
  --text-dark:#1f2937;
  --text-light:#64748b;
  --surface:#ffffff;
  --surface-soft:#f8fafc;
  --border:#e5e7eb;
  --font-sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji';
  --spacing-md:1rem;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:22px;
  --shadow-sm:0 4px 14px rgba(15,23,42,.08);
  --shadow-md:0 14px 38px rgba(15,23,42,.14);
  --transition:220ms ease;
}

/* 2. CSS RESET / NORMALIZATION */
*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

/* 3. BASE ELEMENT STYLING */
html,body{
  min-height:100%;
  font-family:inherit;
  line-height:1.5;
}

a{
  color:var(--primary-color);
  text-decoration:none;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* 4. PUBLIC CATALOGUE SEARCH */
#publicProductSearchBox{
  width:100%;
  display:flex;
  gap:12px;
  align-items:center;
  margin:0 0 24px;
}

#publicProductSearchWrap{
  position:relative;
  flex:1;
}

#publicProductSearchWrap i{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--text-light);
  pointer-events:none;
}

#publicProductSearch{
  width:100%;
  min-height:50px;
  padding:0 16px 0 46px;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  background:var(--surface);
  color:var(--text-dark);
  outline:none;
  transition:var(--transition);
}

#publicProductSearch:focus{
  border-color:var(--primary-color);
  box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

#publicProductSearchBtn{
  min-height:50px;
  padding:0 22px;
  border:0;
  border-radius:var(--radius-md);
  background:var(--primary-color);
  color:#fff;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:var(--transition);
}

#publicProductSearchBtn:hover{
  background:var(--primary-dark);
  transform:translateY(-1px);
}

/* 5. INTERNATIONAL PRODUCT GRID */
#publicProductsGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:24px;
}

/* 6. PRODUCT CARD */
#publicProductsGrid .public-product{
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-width:0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  transition:transform var(--transition),box-shadow var(--transition);
}

#publicProductsGrid .public-product:hover{
  transform:translateY(-6px);
  box-shadow:var(--shadow-md);
}

/* 7. PRODUCT MEDIA / IMAGE LIKE VIDEO */
.public-product-media{
  position:relative;
  aspect-ratio:4/3;
  overflow:hidden;
  background:#e2e8f0;
}

.public-product-media img,
.public-product-media video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform 700ms ease;
}

.public-product:hover .public-product-media img,
.public-product:hover .public-product-media video{
  transform:scale(1.06);
}

.public-product-media video{
  opacity:0;
  pointer-events:none;
  position:absolute;
  inset:0;
}

.public-product-media.is-playing video{
  opacity:1;
}

.public-product-media.is-playing img{
  opacity:0;
}

.public-media-badge{
  position:absolute;
  top:12px;
  left:12px;
  z-index:2;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(15,23,42,.72);
  color:#fff;
  font-size:.72rem;
  font-weight:800;
  backdrop-filter:blur(10px);
}

.public-media-play{
  position:absolute;
  right:12px;
  bottom:12px;
  z-index:3;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(15,23,42,.78);
  color:#fff;
  display:grid;
  place-items:center;
  transition:var(--transition);
}

.public-media-play:hover{
  background:var(--primary-color);
  transform:scale(1.08);
}

.public-product-no-image{
  aspect-ratio:4/3;
  display:grid;
  place-items:center;
  background:var(--surface-soft);
  color:#94a3b8;
  font-size:2.5rem;
}

/* 8. PRODUCT CONTENT */
#publicProductsGrid .public-product-body{
  display:flex;
  flex-direction:column;
  flex:1;
  padding:18px;
}

#publicProductsGrid .public-product-body h4{
  color:var(--text-dark);
  font-size:1.05rem;
  font-weight:800;
  line-height:1.3;
  margin-bottom:6px;
}

#publicProductsGrid .public-product-category{
  color:var(--text-light);
  font-size:.78rem;
  margin-bottom:10px;
}

#publicProductsGrid .public-product-price{
  color:var(--primary-color);
  font-size:1.25rem;
  font-weight:900;
  margin:4px 0 10px;
}

#publicProductsGrid .public-product-description{
  color:var(--text-light);
  font-size:.84rem;
  line-height:1.6;
  margin-bottom:14px;
}

/* 9. SELLER DETAILS */
.public-seller-box{
  margin-top:auto;
  padding:14px;
