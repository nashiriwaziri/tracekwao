<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
 <title>BizBook — Business Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.7;
            color: #333;
            background: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 30px;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            text-align: center;
            padding: 80px 20px 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .hero h1 {
            font-size: 3.5em;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .hero .subtitle {
            font-size: 1.4em;
            opacity: 0.95;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .authors {
            font-size: 1.15em;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .authors a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.6);
            transition: border-color 0.3s;
        }

        .authors a:hover {
            border-bottom-color: #fff;
        }

        .affiliation {
            font-size: 1.05em;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: rgba(255,255,255,0.95);
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            background: #ffffff;
        }

        .btn::before {
            content: "📄";
            font-size: 1.2em;
        }

        .btn.code::before {
            content: "💻";
        }

        .btn.data::before {
            content: "📊";
        }

        /* ===== TEASER SECTION ===== */
        .teaser {
            padding: 70px 20px;
            background: #f8f9fa;
            text-align: center;
        }

        .teaser img {
            width: 100%;
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .teaser img:hover {
            transform: scale(1.02);
        }

        .teaser figcaption {
            margin-top: 25px;
            font-size: 1.05em;
            color: #555;
            line-height: 1.6;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== CONTENT SECTIONS ===== */
        section {
            padding: 70px 20px;
        }

        section:nth-child(even) {
            background: #ffffff;
        }

        section:nth-child(odd) {
            background: #f8f9fa;
        }

        section h2 {
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #667eea;
            text-align: center;
            font-weight: 700;
        }

        .content-text {
            max-width: 850px;
            margin: 0 auto 35px;
            font-size: 1.1em;
            line-height: 1.85;
            color: #444;
        }

        .content-text p {
            margin-bottom: 1.5em;
        }

        /* ===== FIGURE STYLES ===== */
        figure {
            margin: 45px auto;
            text-align: center;
        }

        figure img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 6px 30px rgba(0,0,0,0.12);
        }

        figure.wide img {
            width: 100%;
        }

        figure.medium img {
            max-width: 85%;
        }

        figure figcaption {
            margin-top: 18px;
            font-size: 0.98em;
            color: #666;
            font-style: italic;
            line-height: 1.55;
            padding: 0 20px;
        }

        /* ===== IMAGE GRID ===== */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
            margin: 45px auto;
            max-width: 1100px;
        }

        .image-grid figure {
            margin: 0;
        }

        .image-grid img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .image-grid figcaption {
            margin-top: 14px;
            font-size: 0.93em;
            color: #666;
            padding: 0 8px;
        }

        /* ===== CITATION SECTION ===== */
        .citation {
            background: #2d3748;
            color: #e2e8f0;
            padding: 60px 20px;
        }

        .citation h2 {
            color: #fff;
            margin-bottom: 30px;
        }

        .citation pre {
            background: #1a202c;
            color: #68d391;
            padding: 28px;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 0.92em;
            line-height: 1.65;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
            border: 1px solid #4a5568;
        }

        .citation pre code {
            font-family: 'Courier New', 'Consolas', monospace;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 40px 20px;
            background: #1a202c;
            color: #a0aec0;
            font-size: 0.95em;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.3em;
            }
            
            .hero .subtitle {
                font-size: 1.15em;
            }
            
            section h2 {
                font-size: 1.9em;
            }
            
            .content-text {
                font-size: 1.05em;
            }
            
            .image-grid {
                grid-template-columns: 1fr;
            }
            
            .btn {
                padding: 12px 24px;
                font-size: 0.98em;
            }
        }

        /* ===== SMOOTH SCROLLING ===== */
        html {
            scroll-behavior: smooth;
        }

        /* ===== LINK STYLES ===== */
        a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* ===== HIGHLIGHT BOXES ===== */
        .highlight-box {
            background: linear-gradient(135deg, #e0e7ff 0%, #fce7f3 100%);
            border-left: 5px solid #667eea;
            padding: 24px 28px;
            margin: 35px auto;
            border-radius: 8px;
            max-width: 850px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.1);
        }

        .highlight-box p {
            margin: 0;
            color: #444;
            font-size: 1.08em;
            line-height: 1.7;
        }

        /* ===== COMPARISON TABLE ===== */
        .comparison-table {
            width: 100%;
            max-width: 900px;
            margin: 35px auto;
            border-collapse: collapse;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .comparison-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 0.5px;
        }

        .comparison-table tr:hover {
            background: #f7fafc;
        }

        .comparison-table td:first-child {
            font-weight: 600;
            color: #2d3748;
        }

        .comparison-table tr:last-child td {
            border-bottom: none;
        }

        /* ===== METHOD VISUALIZATION ===== */
        .method-pipeline {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            margin: 40px auto;
            max-width: 1000px;
        }

        .pipeline-step {
            display: flex;
            align-items: center;
            margin: 25px 0;
            gap: 20px;
        }

        .step-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3em;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .step-content h3 {
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 1.25em;
        }

        .step-content p {
            color: #4a5568;
            line-height: 1.65;
            margin: 0;
        }

        .pipeline-arrow {
            text-align: center;
            font-size: 2em;
            color: #667eea;
            margin: 15px 0;
        }

        /* ===== RESULTS GRID ===== */
        .results-showcase {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 45px auto;
            max-width: 1200px;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
        }

        .result-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .result-card .card-body {
            padding: 20px;
        }

        .result-card h3 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 1.15em;
        }

        .result-card p {
            color: #718096;
            font-size: 0.95em;
            line-height: 1.6;
            margin: 0;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 30px;
            padding: 50px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 50px 0;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 3em;
            font-weight: 800;
            display: block;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .stat-label {
            font-size: 1.1em;
            opacity: 0.95;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .stats-bar {
                flex-direction: column;
                gap: 35px;
            }
            
            .stat-number {
                font-size: 2.3em;
            }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* ===== CODE BLOCKS IN CONTENT ===== */
        .content-text code {
            background: #f1f5f9;
            color: #dc2626;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 22px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 25px auto;
            max-width: 850px;
            line-height: 1.6;
        }

        pre code {
            background: none;
            color: inherit;
            padding: 0;
            font-size: 0.92em;
        }
    </style>
</head>
<body>
