<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123b70">
<title>VikobaSACCO | Financial Management System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
:root{
  --primary:#123b70;
  --blue:#1769aa;
  --gold:#d6a642;
  --bg:#f3f6fb;
  --white:#fff;
  --text:#1c2b40;
  --muted:#718096;
  --border:#e3e9f1;
  --danger:#dc3545;
  --success:#16845b;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
button:disabled{opacity:.6;cursor:not-allowed}
.app{display:flex;min-height:100vh}
.sidebar{width:255px;flex-shrink:0;background:var(--primary);color:white;padding:20px 13px}
.brand{padding:10px 12px 24px;border-bottom:1px solid #ffffff25}
.brand h2{margin:0;font-size:20px}
.brand small{font-size:10px;color:#c4d7ef}
.nav-title{font-size:10px;color:#9fb8d6;margin:24px 12px 9px;text-transform:uppercase;letter-spacing:1.2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#d8e5f5;text-align:left;padding:12px;border-radius:8px;margin:3px 0;font-size:12px}
.nav button:hover,.nav button.active{background:#ffffff20;color:white}
.nav i{width:19px;text-align:center}
.main{flex:1;min-width:0}
.topbar{background:white;padding:17px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:12px}
.topbar h3{margin:0;font-size:16px}
.user-info{font-size:11px;color:var(--muted);text-align:right}
.content{padding:24px;max-width:1600px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0 0 7px}
.muted{color:var(--muted);font-size:12px}
.btn{border:0;padding:10px 14px;border-radius:7px;font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--blue);color:white}
.btn-gold{background:var(--gold);color:#17263b}
.btn-danger{background:#fff0f0;color:var(--danger)}
.btn-light{background:#edf2f8;color:var(--text)}
.btn-success{background:#e5f7ed;color:var(--success)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}
.stat{background:white;border:1px solid var(--border);border-radius:12px;padding:18px;min-width:0}
.stat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat-icon{width:39px;height:39px;display:grid;place-items:center;background:#eaf2fc;color:var(--blue);border-radius:10px}
.stat strong{font-size:22px;display:block;margin:15px 0 5px;overflow-wrap:anywhere}
.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:19px;margin-bottom:18px;min-width:0}
.panel h3{font-size:14px;margin:0 0 16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar input{flex:1;min-width:170px}
input,select,textarea{width:100%;border:1px solid #dce3ed;border-radius:7px;padding:11px;background:white;color:var(--text);font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
label{font-size:12px;font-weight:600;display:block;margin-bottom:7px}
.field{margin-bottom:15px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f8fafc;color:#627187;font-weight:700}
.actions{display:flex;gap:5px}
.actions button{border:0;padding:7px 9px;border-radius:5px}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#e9f7ef;color:#16845b;font-size:10px}
.badge.pending{background:#fff4d9;color:#936500}
.badge.inactive{background:#ffeded;color:#c33737}
.notice{padding:12px 14px;border-radius:8px;background:#edf5ff;color:#244c7c;font-size:12px;margin-bottom:15px;line-height:1.7}
.empty{text-align:center;padding:28px;color:var(--muted)}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0c2850,#1769aa)}
.login-card{width:100%;max-width:470px;background:white;padding:30px;border-radius:16px;box-shadow:0 20px 60px #001b4533;max-height:95vh;overflow:auto}
.login-card h1{font-size:24px;margin:0 0 8px;color:var(--primary)}
.login-card>p{font-size:12px;color:var(--muted);line-height:1.7}
.login-logo{width:53px;height:53px;background:var(--primary);color:var(--gold);display:grid;place-items:center;border-radius:14px;font-size:24px;margin-bottom:18px}
.login-card form>.btn{width:100%;padding:13px}
.link-btn{background:none;border:0;color:var(--blue);font-weight:700;font-size:12px;padding:0}
.auth-switch{text-align:center;margin-top:20px;font-size:12px;color:var(--muted)}
.auth-message{padding:12px;border-radius:8px;margin-top:15px;font-size:12px;line-height:1.7;overflow-wrap:anywhere}
.auth-message.success{background:#e5f7ed;color:#16845b}
.auth-message.error{background:#fff0f0;color:#c33737}
.modal{position:fixed;inset:0;background:#06172c99;z-index:20;display:grid;place-items:center;padding:15px}
.modal-card{width:100%;max-width:600px;max-height:90vh;overflow:auto;background:white;border-radius:13px;padding:23px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-head h3{margin:0;font-size:16px}
.close{border:0;background:#edf2f8;border-radius:50%;width:32px;height:32px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.span-2{grid-column:span 2}
.toast{position:fixed;right:20px;bottom:20px;background:#142d4d;color:white;padding:14px 20px;border-radius:8px;z-index:50;font-size:12px;max-width:90vw;line-height:1.6}
footer{text-align:center;padding:20px;color:var(--muted);font-size:10px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
 .sidebar{width:61px;padding:14px 6px}
 .brand{padding:10px 2px 18px;text-align:center}
 .brand h2{font-size:0}
 .brand h2:after{content:"V";font-size:22px}
 .brand small,.nav-title,.nav button span{display:none}
 .nav button{justify-content:center;padding:14px 4px}
 .nav i{width:auto}
 .content{padding:13px}
 .topbar{padding:14px}
 .cards{gap:9px}
 .stat{padding:12px}
 .stat strong{font-size:17px}
 .form-grid{grid-template-columns:1fr}
 .span-2{grid-column:span 1}
 .login-card{padding:23px}
}
@media print{
 .sidebar,.topbar .user-info,.page-head button,.toolbar,.actions,footer{display:none!important}
 .content{padding:0}
 .panel,.stat{break-inside:avoid}
 body{background:white}
}
</style>
</head>

<body>

<!-- AUTHENTICATION -->
<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-vault"></i></div>
    <h1>VikobaSACCO</h1>
    <p id="authSubtitle">Mfumo wa Usimamizi wa Vikoba na SACCOs.</p>

    <form id="loginForm">
      <div class="field">
        <label>Barua Pepe</label>
        <input id="loginEmail" type="email" autocomplete="email" required placeholder="name@example.com">
      </div>
      <div class="field">
        <label>Nenosiri</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Nenosiri lako">
      </div>
      <div style="text-align:right;margin-bottom:18px">
        <button type="button" class="link-btn" id="showForgot">Umesahau nenosiri?</button>
      </div>
      <button class="btn btn-primary" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Ingia</button>
      <p class="auth-switch">Huna akaunti? <button type="button" class="link-btn" id="showSignup">Jisajili hapa</button></p>
    </form>

    <form id="signupForm" class="hidden">
      <div class="field">
        <label>Jina Kamili la Kiongozi</label>
        <input id="signupName" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label>Namba ya Simu</label>
        <input id="signupPhone" type="tel" autocomplete="tel" required placeholder="+255...">
      </div>
      <div class="field">
        <label>Barua Pepe</label>
        <input id="signupEmail" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label>Aina ya Kikundi</label>
        <select id="signupGroupType" required>
          <option value="">Chagua aina</option>
          <option value="vikoba">Vikoba</option>
          <option value="sacco">SACCO</option>
        </select>
      </div>
      <div class="field">
        <label>Jina la Kikundi</label>
        <input id="signupGroupName" type="text" required placeholder="Jina rasmi la kikundi">
      </div>
      <div class="field">
        <label>Eneo la Kikundi</label>
        <input id="signupLocation" type="text" required placeholder="Mkoa, Wilaya, Kata">
      </div>
      <div class="field">
        <label>Nenosiri (angalau herufi 8)</label>
        <input id="signupPassword" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label>Thibitisha Nenosiri</label>
        <input id="signupConfirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <label style="display:flex;gap:9px;align-items:flex-start;font-weight:400;margin:15px 0">
        <input id="signupTerms" type="checkbox" style="width:auto;margin-top:2px" required>
        <span>Ninakubali masharti ya matumizi na sera ya faragha.</span>
      </label>
      <button class="btn btn-primary" type="submit"><i class="fa-solid fa-user-plus"></i> Sajili Kikundi</button>
      <p class="auth-switch">Tayari una akaunti? <button type="button" class="link-btn" id="showLogin">Ingia hapa</button></p>
    </form>

    <form id="forgotForm" class="hidden">
      <div class="field">
        <label>Barua Pepe Uliyosajili</label>
        <input id="forgotEmail" type="email" autocomplete="email" required>
      </div>
      <button class="btn btn-primary" type="submit"><i class="fa-solid fa-envelope"></i> Tuma Kiungo cha Reset</button>
      <p class="auth-switch"><button type="button" class="link-btn" id="backToLogin">Rudi kwenye Sign In</button></p>
    </form>

    <div id="authMessage" class="auth-message hidden" aria-live="polite"></div>
  </div>
</section>

<!-- MAIN APPLICATION -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <h2>VikobaSACCO</h2>
      <small>Smart Financial Platform</small>
    </div>
    <nav class="nav" id="navigation">
      <div class="nav-title">Menyu Kuu</div>
      <button data-page="dashboard" class="active"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></button>
      <button data-page="groups" data-roles="super_admin"><i class="fa-solid fa-people-group"></i><span>Vikundi</span></button>
      <button data-page="members" data-roles="super_admin,leader,secretary"><i class="fa-solid fa-users"></i><span>Wanachama</span></button>
      <button data-page="savings"><i class="fa-solid fa-piggy-bank"></i><span>Akiba</span></button>
      <button data-page="shares"><i class="fa-solid fa-chart-pie"></i><span>Hisa</span></button>
      <button data-page="loans"><i class="fa-solid fa-hand-holding-dollar"></i><span>Mikopo</span></button>
      <button data-page="repayments"><i class="fa-solid fa-money-bill-transfer"></i><span>Marejesho</span></button>
      <button data-page="expenses" data-roles="super_admin,leader,treasurer,accountant"><i class="fa-solid fa-receipt"></i><span>Matumizi</span></button>
      <button data-page="announcements"><i class="fa-solid fa-bullhorn"></i><span>Matangazo</span></button>
      <button data-page="reports"><i class="fa-solid fa-chart-column"></i><span>Ripoti</span></button>
      <div class="nav-title">Usimamizi</div>
      <button data-page="users" data-roles="super_admin"><i class="fa-solid fa-user-shield"></i><span>Watumiaji</span></button>
      <button data-page="plans" data-roles="super_admin"><i class="fa-solid fa-gem"></i><span>Vifurushi</span></button>
      <button data-page="payments"><i class="fa-solid fa-credit-card"></i><span>Malipo</span></button>
      <button data-page="settings"><i class="fa-solid fa-gear"></i><span>Akaunti</span></button>
      <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i><span>Toka</span></button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h3 id="pageTitle">Dashboard</h3>
      <div class="user-info">
        <strong id="userName">Mtumiaji</strong><br>
        <span id="userRole">Member</span>
      </div>
    </header>
    <section class="content"><div id="pageContent"></div></section>
    <footer>VikobaSACCO © 2026 | Smart Systems. Better Future.</footer>
  </main>
</div>

<!-- ADD / EDIT MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">Ongeza Taarifa</h3>
      <button class="close" id="closeModal" type="button"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="recordForm">
      <div id="formFields" class="form-grid"></div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:15px">
        <button type="button" class="btn btn-light" id="cancelModal">Ghairi</button>
        <button type="submit" class="btn btn-primary">Hifadhi</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden" role="status"></div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth, onAuthStateChanged,
  signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, sendEmailVerification, signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore, collection, doc, getDoc, getDocs,
  addDoc, updateDoc, deleteDoc, query, where,
  serverTimestamp, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* =====================================================
   FIREBASE CONFIGURATION
   Replace apiKey and appId with your actual Firebase values.
===================================================== */

const firebaseConfig = {
  apiKey: "WEKA_FIREBASE_API_KEY_HAPA",
  authDomain: "ncrs-aeb43.firebaseapp.com",
  projectId: "ncrs-aeb43",
  storageBucket: "ncrs-aeb43.firebasestorage.app",
  messagingSenderId: "786434442929",
  appId: "WEKA_FIREBASE_APP_ID_HAPA"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const $ = id => document.getElementById(id);

let currentUser = null;
let profile = null;
let currentPage = "dashboard";
let activeCollection = "";
let editingId = null;
let records = [];
let signupInProgress = false;

const pageNames = {
  dashboard:"Dashboard",
  groups:"Usimamizi wa Vikundi",
  members:"Usimamizi wa Wanachama",
  savings:"Akiba za Wanachama",
  shares:"Hisa za Wanachama",
  loans:"Usimamizi wa Mikopo",
  repayments:"Marejesho ya Mikopo",
  expenses:"Matumizi ya Kikundi",
  announcements:"Matangazo",
  reports:"Ripoti za Fedha",
  users:"Usimamizi wa Watumiaji",
  plans:"Vifurushi vya Mfumo",
  payments:"Malipo ya Mfumo",
  settings:"Akaunti na Mipangilio"
};

const collectionMap = {
  groups:"groups",
  members:"members",
  savings:"savings",
  shares:"shares",
  loans:"loans",
  repayments:"repayments",
  expenses:"expenses",
  announcements:"announcements",
  users:"users",
  plans:"plans",
  payments:"paymentRequests"
};

const schemas = {
  groups:[
    ["name","Jina la Kikundi","text",true],
    ["groupCode","Namba ya Kikundi","text",true],
    ["type","Aina ya Kikundi","select",true,["vikoba","sacco"]],
    ["location","Eneo","text",true],
    ["description","Maelezo","textarea"],
    ["status","Hali","select",true,["active","suspended"]]
  ],
  members:[
    ["fullName","Jina Kamili","text",true],
    ["phone","Namba ya Simu","tel",true],
    ["email","Barua Pepe","email"],
    ["memberNumber","Namba ya Mwanachama","text"],
    ["role","Wadhifa","select",true,["member","leader","secretary","treasurer","accountant"]],
    ["status","Hali","select",true,["active","suspended"]]
  ],
  savings:[
    ["memberId","ID ya Mwanachama","text",true],
    ["amount","Kiasi cha Akiba (TZS)","number",true],
    ["date","Tarehe","date",true],
    ["reference","Namba ya Muamala","text"],
    ["note","Maelezo","textarea"]
  ],
  shares:[
    ["memberId","ID ya Mwanachama","text",true],
    ["quantity","Idadi ya Hisa","number",true],
    ["price","Bei ya Hisa (TZS)","number",true],
    ["date","Tarehe","date",true]
  ],
  loans:[
    ["memberId","ID ya Mwanachama","text",true],
    ["amount","Kiasi cha Mkopo (TZS)","number",true],
    ["purpose","Sababu ya Mkopo","textarea",true],
    ["termMonths","Muda (miezi)","number",true],
    ["status","Hali","select",true,["pending","approved","rejected","paid"]]
  ],
  repayments:[
    ["loanId","ID ya Mkopo","text",true],

    ["amount","Kiasi Kilicholipwa (TZS)","number",true],

    ["reference","Namba ya Muamala","text"]
  ],
  expenses:[
    ["description","Maelezo ya Matumizi","text",true],
    ["amount","Kiasi (TZS)","number",true],

  ],

  ],
  users:[
    ["fullName","Jina Kamili","text",true],
    ["email","Barua Pepe","email",true],
    ["phone","Namba ya Simu","tel"],
    ["role","Role","select",true,["leader","secretary","treasurer","accountant","member"]],
    ["groupId","ID ya Kikundi","text"],
    ["status","Hali","select",true,["active","suspended"]]
  ],
  plans:[
    ["name","Jina la Kifurushi","text",true],
    ["price","Bei (TZS)","number",true],
    ["durationDays","Muda (siku)","number",true],
    ["description","Maelezo","textarea"],
    ["status","Hali","select",true,["active","inactive"]]
  ],
  payments:[
    ["planId","ID ya Kifurushi","text",true],
    ["method","Njia ya Malipo","select",true,["mobile_money","bank","other"]],
    ["amount","Kiasi (TZS)","number",true],
    ["reference","Namba ya Muamala","text",true]
  ]
};

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function toast(message){
  $("toast").textContent = message;
  $("toast").classList.remove("hidden");
  setTimeout(()=>$("toast").classList.add("hidden"),4000);
}

function authMessage(message,type="success"){
  const el=$("authMessage");
  el.textContent=message;
  el.className=`auth-message ${type}`;
}

function showAuthForm(formId){
  ["loginForm","signupForm","forgotForm"].forEach(id=>{
    $(id).classList.toggle("hidden",id!==formId);
  });
  $("authMessage").classList.add("hidden");
  $("authSubtitle").textContent={
    loginForm:"Ingia kwenye mfumo wa Vikoba na SACCOs.",
    signupForm:"Jisajili na uunde kikundi chako.",
    forgotForm:"Pata kiungo cha kubadilisha nenosiri."
  }[formId];
}

$("showSignup").addEventListener("click",()=>showAuthForm("signupForm"));
$("showLogin").addEventListener("click",()=>showAuthForm("loginForm"));
$("showForgot").addEventListener("click",()=>showAuthForm("forgotForm"));
$("backToLogin").addEventListener("click",()=>showAuthForm("loginForm"));

function isAdmin(){return profile?.role==="super_admin";}
function isLeader(){return ["leader","secretary","treasurer","accountant"].includes(profile?.role);}
function canManage(){return isAdmin()||isLeader();}

function canEdit(page){
  if(isAdmin()) return true;
  if(page==="members") return ["leader","secretary"].includes(profile?.role);
  if(page==="loans") return profile?.role==="member" || canManage();
  if(page==="repayments") return ["treasurer","accountant","leader"].includes(profile?.role);
  if(page==="announcements") return canManage();
  return isLeader();
}

/* =====================================================
   SIGN IN
===================================================== */

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const button=e.submitter;
  button.disabled=true;
  try{
    await signInWithEmailAndPassword(
      auth,$("loginEmail").value.trim(),$("loginPassword").value
    );
  }catch(error){
    console.error(error);
    authMessage("Imeshindikana kuingia. Hakiki email na nenosiri.","error");
  }finally{
    button.disabled=false;
  }
});

/* =====================================================
   SIGN UP: ACCOUNT + GROUP + LEADER MEMBER RECORD
===================================================== */

$("signupForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const name=$("signupName").value.trim();
  const phone=$("signupPhone").value.trim();
  const email=$("signupEmail").value.trim().toLowerCase();
  const groupName=$("signupGroupName").value.trim();
  const groupType=$("signupGroupType").value;
  const location=$("signupLocation").value.trim();
  const password=$("signupPassword").value;
  const confirmPassword=$("signupConfirmPassword").value;

  if(password.length<8)
    return authMessage("Nenosiri lazima liwe na angalau herufi 8.","error");

  if(password!==confirmPassword)
    return authMessage("Nenosiri halifanani.","error");

  const button=e.submitter;
  button.disabled=true;
  signupInProgress=true;

  let createdUser=null;

  try{
    const credential=await createUserWithEmailAndPassword(auth,email,password);
    createdUser=credential.user;

    const uid=createdUser.uid;
    const groupRef=doc(collection(db,"groups"));
    const groupId=groupRef.id;
    const groupCode="VS-"+crypto.randomUUID().replace(/-/g,"").slice(0,8).toUpperCase();

    await setDoc(groupRef,{
      name:groupName,
      groupCode,
      type:groupType,
      location,
      leaderUid:uid,
      status:"active",
      subscriptionStatus:"trial",
      createdBy:uid,
      createdAt:serverTimestamp()
    });

    await setDoc(doc(db,"users",uid),{
      uid,
      fullName:name,
      phone,
      email,
      role:"leader",
      groupId,
      groupName,
      status:"active",
      emailVerified:false,
      createdAt:serverTimestamp()
    });

    await addDoc(collection(db,"members"),{
      uid,
      fullName:name,
      phone,
      email,
      memberNumber:"LEADER-"+groupCode,
      role:"leader",
      groupId,
      status:"active",
      createdBy:uid,
      createdAt:serverTimestamp()
    });

    await sendEmailVerification(createdUser);

    authMessage(
      "Usajili umekamilika. Namba ya Kikundi: "+groupCode+
      ". Thibitisha barua pepe yako. Mfumo unafungua akaunti yako.",
      "success"
    );

    await loadAuthenticatedUser(createdUser);

  }catch(error){
    console.error("Signup error:",error);
    authMessage(
      error.code==="auth/email-already-in-use"
        ?"Barua pepe hii imeshasajiliwa. Jaribu kuingia."
        :"Usajili haujakamilika. Hakiki Firebase Rules na ujaribu tena.",
      "error"
    );
    if(createdUser){
      toast("Akaunti ya Authentication inaweza kuwa imetengenezwa. Ikiwa usajili haujakamilika, wasiliana na msimamizi.");
    }
  }finally{
    signupInProgress=false;
    button.disabled=false;
  }
});

/* =====================================================
   AUTH STATE & USER PROFILE
===================================================== */

onAuthStateChanged(auth,async user=>{
  if(signupInProgress) return;

  if(!user){
    currentUser=null;
    profile=null;
    $("app").classList.add("hidden");
    $("loginScreen").classList.remove("hidden");
    return;
  }

  await loadAuthenticatedUser(user);
});

async function loadAuthenticatedUser(user){
  try{
    currentUser=user;
    const snap=await getDoc(doc(db,"users",user.uid));

    if(!snap.exists()){
      $("app").classList.add("hidden");
      $("loginScreen").classList.remove("hidden");
      authMessage("Akaunti haina wasifu wa mfumo. Wasiliana na Super Admin.","error");
      return;
    }

    profile={uid:user.uid,...snap.data()};

    if(profile.status==="suspended"){
      await signOut(auth);
      authMessage("Akaunti yako imesimamishwa.","error");
      return;
    }

    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("userName").textContent=profile.fullName||user.email;
    $("userRole").textContent=(profile.role||"member").replaceAll("_"," ");

    applyNavigationPermissions();
    await showPage("dashboard");
  }catch(error){
    console.error(error);
    toast("Imeshindikana kusoma wasifu. Hakiki Firestore Rules.");
  }
}

$("logoutBtn").addEventListener("click",()=>signOut(auth));

function applyNavigationPermissions(){
  document.querySelectorAll("[data-roles]").forEach(button=>{
    const roles=button.dataset.roles.split(",");
    button.classList.toggle("hidden",!roles.includes(profile?.role));
  });
}

/* =====================================================
   NAVIGATION
===================================================== */

$("navigation").addEventListener("click",e=>{
  const button=e.target.closest("[data-page]");
  if(button) showPage(button.dataset.page);
});

async function showPage(page){
  currentPage=page;
  $("pageTitle").textContent=pageNames[page]||page;

  document.querySelectorAll("[data-page]").forEach(button=>{
    button.classList.toggle("active",button.dataset.page===page);
  });

  if(page==="dashboard") return showDashboard();
  if(page==="settings") return showSettings();
  if(page==="reports") return showReports();
  return renderTable(page);
}

/* =====================================================
   FIRESTORE DATA ACCESS
===================================================== */

async function loadCollection(name){
  const col=collectionMap[name];
  if(!col) throw new Error("Collection haijaruhusiwa.");

  let q;

  if(isAdmin()){
    q=collection(db,col);
  }else if(profile.groupId){
    q=query(collection(db,col),where("groupId","==",profile.groupId));
  }else{
    q=query(collection(db,col),where("ownerUid","==",currentUser.uid));
  }

  const snapshot=await getDocs(q);
  let data=snapshot.docs.map(d=>({id:d.id,...d.data()}));

  if(profile.role==="member"){
    if(name==="members"){
      data=data.filter(r=>r.uid===currentUser.uid);
    }else if(["savings","shares","loans","repayments"].includes(name)){
      data=data.filter(r=>r.memberId===currentUser.uid);
    }else if(name==="expenses"||name==="users"||name==="groups"||name==="payments"){
      data=[];
    }else if(name==="announcements"){
      data=data.filter(r=>
        r.audience==="all"||
        (r.audience==="group"&&r.groupId===profile.groupId)
      );
    }
  }

  if(name==="payments"&&!isAdmin()){
    data=data.filter(r=>r.uid===currentUser.uid);
  }

  return data;
}

function statCard(title,value,icon){
  return `<div class="stat">

      <span class="stat-icon"><i class="fa-solid ${icon}"></i></span>
    </div>
    <strong>${escapeHTML(value)}</strong>
    <span class="muted">Taarifa za mfumo</span>
  </div>`;
}

function money(value){
  return new Intl.NumberFormat("sw-TZ",{
    style:"currency",currency:"TZS",maximumFractionDigits:0
  }).format(Number(value)||0);
}

/* =====================================================
   TABLES / SEARCH / CRUD
===================================================== */

async function renderTable(page){
  const canAdd=canEdit(page);

  $("pageContent").innerHTML=`
    <div class="page-head">
      <div>
        <h1>${escapeHTML(pageNames[page]||page)}</h1>
        <div class="muted">Tafuta na simamia taarifa kulingana na ruhusa zako.</div>
      </div>
      ${canAdd?'<button class="btn btn-primary" id="addRecord"><i class="fa-solid fa-plus"></i> Ongeza</button>':""}
    </div>
    <div class="panel">
      <div class="notice">Taarifa zinaonyeshwa kulingana na akaunti na kikundi chako.</div>
      <div class="toolbar">
        <input id="searchRecords" placeholder="Tafuta taarifa...">
        <button class="btn btn-light" id="refreshRecords"><i class="fa-solid fa-rotate"></i> Refresh</button>
        <button class="btn btn-light" id="exportRecords"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
      </div>
      <div class="table-wrap">
        <table><thead id="tableHead"></thead><tbody id="tableBody"><tr><td>Inapakia...</td></tr></tbody></table>
      </div>
    </div>`;

  if(canAdd) $("addRecord").onclick=()=>openForm(page);
  $("refreshRecords").onclick=()=>renderTable(page);
  $("exportRecords").onclick=()=>exportCSV(page);

  try{
    records=await loadCollection(page);
    drawRows(page,records);
    $("searchRecords").addEventListener("input",e=>{
      const term=e.target.value.toLowerCase();
      drawRows(page,records.filter(row=>
        Object.values(row).some(value=>String(value??"").toLowerCase().includes(term))
      ));
    });
  }catch(error){
    console.error(error);
    $("tableBody").innerHTML='<tr><td>Imeshindikana kupata taarifa. Hakiki ruhusa za Firestore.</td></tr>';
  }
}

function drawRows(page,data){
  const fields=schemas[page]||[];

  $("tableHead").innerHTML=`<tr>
    ${fields.map(f=>`<th>${escapeHTML(f[1])}</th>`).join("")}
    <th>Vitendo</th>
  </tr>`;

  if(!data.length){
    $("tableBody").innerHTML=`<tr><td colspan="${fields.length+1}" class="empty">Hakuna taarifa zilizopatikana.</td></tr>`;
    return;
  }

  $("tableBody").innerHTML=data.map(row=>`
    <tr>
      ${fields.map(f=>{
        let value=row[f[0]]??"—";
        if(["amount","price"].includes(f[0])) value=money(value);
        if(f[0]==="status"){
          const cls=["pending","trial"].includes(value)?"pending":
            ["suspended","inactive","rejected"].includes(value)?"inactive":"";
          return `<td><span class="badge ${cls}">${escapeHTML(value)}</span></td>`;
        }
        return `<td>${escapeHTML(value)}</td>`;
      }).join("")}
      <td><div class="actions">
        ${canEdit(page)?`<button class="btn-light" title="Hariri" data-edit="${escapeHTML(row.id)}"><i class="fa-solid fa-pen"></i></button>`:""}
        ${(isAdmin()||(canManage()&&!["users","groups","plans","payments"].includes(page)))?
          `<button class="btn-danger" title="Futa" data-delete="${escapeHTML(row.id)}"><i class="fa-solid fa-trash"></i></button>`:""}
        ${page==="loans"&&canManage()&&row.status==="pending"?
          `<button class="btn-success" data-approve="${escapeHTML(row.id)}">Idhinisha</button>`:""}
      </div></td>
    </tr>`).join("");

  $("tableBody").querySelectorAll("[data-edit]").forEach(btn=>{
    btn.onclick=()=>openForm(page,data.find(r=>r.id===btn.dataset.edit));
  });

  $("tableBody").querySelectorAll("[data-delete]").forEach(btn=>{
    btn.onclick=()=>deleteRecord(page,btn.dataset.delete);
  });

  $("tableBody").querySelectorAll("[data-approve]").forEach(btn=>{
    btn.onclick=()=>approveLoan(btn.dataset.approve);
  });
}

/* =====================================================
   ADD / EDIT FORM
===================================================== */

function openForm(page,record=null){
  if(!canEdit(page)){
    toast("Huna ruhusa ya kufanya mabadiliko.");
    return;
  }

  activeCollection=page;
  editingId=record?.id||null;
  $("modalTitle").textContent=editingId?"Hariri Taarifa":"Ongeza Taarifa";

  $("formFields").innerHTML=(schemas[page]||[]).map(field=>{
    const [key,label,type,required,options]=field;
    const value=record?.[key]??"";
    let input="";

    if(type==="select"){
      input=`<select name="${key}" ${required?"required":""}>
        <option value="">Chagua...</option>
        ${options.map(option=>`<option value="${option}" ${value===option?"selected":""}>${option}</option>`).join("")}
      </select>`;
    }else if(type==="textarea"){
      input=`<textarea name="${key}" rows="3" ${required?"required":""}>${escapeHTML(value)}</textarea>`;
    }else{
      input=`<input name="${key}" type="${type}" value="${escapeHTML(value)}" ${required?"required":""} ${type==="number"?'min="0" step="any"':""}>`;
    }

    return `<div class="field ${type==="textarea"?"span-2":""}"><label>${escapeHTML(label)}</label>${input}</div>`;
  }).join("");

  $("modal").classList.remove("hidden");
}

function closeForm(){
  $("modal").classList.add("hidden");
  $("recordForm").reset();
  editingId=null;
}

$("closeModal").onclick=closeForm;
$("cancelModal").onclick=closeForm;

$("recordForm").addEventListener("submit",async e=>{
  e.preventDefault();

  if(!currentUser||!profile) return;

  const formData=new FormData(e.target);
  const data={};

  for(const [key,value] of formData.entries()){
    data[key]=value.trim();
    if(["amount","price","quantity","termMonths","durationDays"].includes(key)){
      data[key]=Number(value);
    }
  }

  if(!isAdmin()){
    data.groupId=profile.groupId||"";
    data.ownerUid=currentUser.uid;
  }else if(!data.groupId&&profile.groupId){
    data.groupId=profile.groupId;
  }

  data.updatedAt=serverTimestamp();

  if(!editingId){
    data.createdAt=serverTimestamp();
    data.createdBy=currentUser.uid;
  }

  if(activeCollection==="announcements"){
    if(data.audience==="all"&&!isAdmin()){
      return toast("Matangazo ya mfumo mzima ni ya Super Admin pekee.");
    }
    if(data.audience==="group") data.groupId=profile.groupId||"";
  }

  if(activeCollection==="payments"){
    data.uid=currentUser.uid;
    data.groupId=profile.groupId||"";
    data.status="pending";
  }

  try{
    if(editingId){
      await updateDoc(doc(db,collectionMap[activeCollection],editingId),data);
      toast("Taarifa zimehaririwa.");
    }else{
      await addDoc(collection(db,collectionMap[activeCollection]),data);
      toast("Taarifa zimehifadhiwa.");
    }
    closeForm();
    await renderTable(activeCollection);
  }catch(error){
    console.error(error);
    toast("Imeshindikana kuhifadhi. Hakiki ruhusa za Firestore.");
  }
});

/* =====================================================
   CSV EXPORT
===================================================== */

async function exportCSV(page){
  try{
    const data=await loadCollection(page);
    if(!data.length) return toast("Hakuna taarifa za ku-export.");

    const headers=Object.keys(data[0]);
    const csv=[
      headers.map(csvCell).join(","),
      ...data.map(row=>headers.map(key=>csvCell(row[key])).join(","))
    ].join("\r\n");

    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`vikobasacco-${page}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }catch(error){
    console.error(error);
    toast("Imeshindikana kuandaa CSV.");
  }
}

function csvCell(value){
  if(value&&typeof value==="object"){
    value=value.toDate?value.toDate().toISOString():JSON.stringify(value);
  }
  return '"'+String(value??"").replace(/"/g,'""')+'"';
}
